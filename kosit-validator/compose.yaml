# Beispiel: KoSIT-Validator im selben Docker-Netz wie n8n betreiben.
# Im n8n-Node "Konfiguration" dann kositUrl = http://kosit-validator:8081/
services:
  kosit-validator:
    image: ghcr.io/itplr-kosit/validator.git:latest
#    build: .
    container_name: kosit-validator
    restart: unless-stopped
    expose:
      - "8081"

networks: 
  n8n-default: