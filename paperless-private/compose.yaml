# Paperless-ngx (Arcane project paperless-private) auf CT 200
# Traefik: https://paperless.home.kronast-family.de  |  direkt: http://192.168.1.244:8000
networks:
  internal:
    driver: bridge

services:
  broker:
    container_name: paperless-redis
    image: docker.io/valkey/valkey:${VERSION_VALKEY}
    restart: unless-stopped
    networks: [internal]
    volumes:
      - /docker/paperless/redisdata:/data

  db:
    container_name: paperless-db
    image: docker.io/library/postgres:${VERSION_POSTGRES}
    restart: unless-stopped
    networks: [internal]
    volumes:
      - /docker/paperless/pgdata17:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  webserver:
    container_name: paperless
    image: ghcr.io/paperless-ngx/paperless-ngx:${VERSION_PAPERLESS}
    restart: unless-stopped
    depends_on: [db, broker, gotenberg, tika]
    networks: [internal]
    ports:
      - "8000:8000"
    volumes:
      - /docker/paperless/data:/usr/src/paperless/data
      - /docker/paperless/media:/usr/src/paperless/media
      - /mnt/dms/originals:/usr/src/paperless/media/documents/originals
      - /mnt/dms/archive:/usr/src/paperless/media/documents/archive
      - /docker/paperless/export:/usr/src/paperless/export
    env_file: .env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_TIKA_ENABLED: "1"
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998

  gotenberg:
    container_name: paperless-gotenberg
    image: docker.io/gotenberg/gotenberg:${VERSION_GOTENBERG}
    restart: unless-stopped
    networks: [internal]
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*

  tika:
    container_name: paperless-tika
    image: docker.io/apache/tika:${VERSION_TIKA}
    restart: unless-stopped
    networks: [internal]
