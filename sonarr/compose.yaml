# Migriert am 03.10.2026 aus Komodo-Stack "sonarr" (Compose-Projekt "arr-stack")
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls326
    container_name: sonarr
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "${SONARR_PORT}:8989"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${SONARR_CONFIG}:/config
      - ${DLDIR}/completed:/downloads/completed
      - ${TVDIR}:/serien
      - ${COMEDYDIR}:/comedy
      - /etc/localtime:/etc/localtime:ro
