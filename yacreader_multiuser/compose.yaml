# Ein offizieller YACReaderLibraryServer pro Benutzer (getrennte Bibliotheks-DB + Lesefortschritt).
# Comics werden read-only geteilt; die DB liegt pro Benutzer lokal und wird ueber /comics/.yacreaderlibrary gemountet.
# Kinder (jessi/tobi): Bibliothek = altersgefilterte Symlink-Ansicht ${DATA_BASE}/<user>/view (Skript ${DATA_BASE}/agefilter/build-views.py,
# naechtlich 03:00 per systemd-Timer yacreader-agefilter), Symlinks zeigen auf /comics/...
# Umgestellt am 03.10.2026 (vorher jaap14/yacreader-multiuser mit gemeinsamer DB; Backup: /docker/yacreader-backup-20261003)

services:
  yacreader-stefan:
    image: yacreader/yacreaderlibraryserver:10.3.2
    container_name: yacreader-stefan
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${COMICDIR}:/comics:ro
      - ${DATA_BASE}/stefan/library:/comics/.yacreaderlibrary
      - ${DATA_BASE}/stefan/config:/config
    ports:
      - "${PORT_STEFAN}:8080"
    network_mode: bridge
    restart: unless-stopped

  yacreader-jessi:
    image: yacreader/yacreaderlibraryserver:10.3.2
    container_name: yacreader-jessi
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${COMICDIR}:/comics:ro
      - ${DATA_BASE}/jessi/view:/library:ro
      - ${DATA_BASE}/jessi/library:/library/.yacreaderlibrary
      - ${DATA_BASE}/jessi/config:/config
    ports:
      - "${PORT_JESSI}:8080"
    network_mode: bridge
    restart: unless-stopped

  yacreader-tobi:
    image: yacreader/yacreaderlibraryserver:10.3.2
    container_name: yacreader-tobi
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${COMICDIR}:/comics:ro
      - ${DATA_BASE}/tobi/view:/library:ro
      - ${DATA_BASE}/tobi/library:/library/.yacreaderlibrary
      - ${DATA_BASE}/tobi/config:/config
    ports:
      - "${PORT_TOBI}:8080"
    network_mode: bridge
    restart: unless-stopped

