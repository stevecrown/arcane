# https://github.com/jaapjan14/yacreader-multiuser/tree/main
# Image: nur Tag "latest" verfuegbar (kein Versions-Tag) - daher nicht gepinnt

services:
  yacreader-stefan:
    image: jaap14/yacreader-multiuser:latest
    container_name: yacreader-stefan
    environment:
      - YACREADER_USER=stefan
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${COMICDIR}:/comics
      - ${CONFIG_BASE}/stefan:/config
    ports:
      - "${PORT_STEFAN}:8080"
    network_mode: bridge
    restart: unless-stopped

  yacreader-jessi:
    image: jaap14/yacreader-multiuser:latest
    container_name: yacreader-jessi
    environment:
      - YACREADER_USER=jessi
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${COMICDIR}:/comics
      - ${CONFIG_BASE}/jessi:/config
    ports:
      - "${PORT_JESSI}:8080"
    network_mode: bridge
    restart: unless-stopped
